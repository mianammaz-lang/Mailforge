<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mailforge Health</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { max-width: 400px; width: 100%; border: none; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .login-header { background: linear-gradient(135deg, #4f46e5, #3b82f6); color: white; border-top-left-radius: 1rem; border-top-right-radius: 1rem; padding: 2rem; text-align: center; }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-header">
            <i class="bi bi-shield-check fs-1"></i>
            <h3 class="mt-2 fw-bold">Mailforge Health</h3>
            <p class="mb-0 text-white-50">Sign in to your account</p>
        </div>
        <div class="card-body p-4">
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form action="/login" method="post">
                <div class="mb-3">
                    <label class="form-label fw-medium">Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="admin@example.com">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium">Password</label>
                    <div class="input-group">
                        <input type="password" name="password" id="password" class="form-control" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Sign In</button>
            </form>
        </div>
    </div>
    <script>
        function togglePassword() {
            var p = document.getElementById("password");
            var i = document.getElementById("toggleIcon");
            if (p.type === "password") { p.type = "text"; i.className = "bi bi-eye-slash"; } 
            else { p.type = "password"; i.className = "bi bi-eye"; }
        }
    </script>
</body>
</html>
